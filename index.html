<!-- GALERIA AUTOMÁTICA DE FOTOS -->
<section id="servicos" class="portfolio">
    <span style="color: var(--accent-brown); text-transform: uppercase; font-size: 0.8rem; letter-spacing: 3px; display: block; margin-bottom: 0.5rem;">Galeria de Trabalhos</span>
    <h2>Serviços Executados</h2>
    <p>Projetos reais de restauração, calafetação e aplicação de verniz.</p>
    
    <!-- O JavaScript vai inserir todas as fotos do GitHub aqui dentro -->
    <div id="galeria-fotos" class="grid-fotos">
        <p style="color: var(--text-muted); grid-column: 1/-1;">Carregando fotos do portfólio...</p>
    </div>
</section>

<script>
    async function carregarGaleriaGitHub() {
        // Busca os arquivos direto da pasta do repositório no GitHub
        const usuario = '7raizespisonobre-code';
        const repositorio = '7raizes-pisonobre';
        const galeriaContainer = document.getElementById('galeria-fotos');

        try {
            const resposta = await fetch(`https://api.github.com/repos/${usuario}/${repositorio}/contents/`);
            const arquivos = await resposta.json();

            // Filtra apenas imagens e exclui fotos de fundo/prints se necessário
            const fotos = arquivos.filter(arquivo => 
                arquivo.name.match(/\.(jpg|jpeg|png)$/i)
            );

            galeriaContainer.innerHTML = ''; // Limpa a mensagem de carregamento

            fotos.forEach(foto => {
                const cardFoto = document.createElement('div');
                cardFoto.className = 'foto-container';
                cardFoto.innerHTML = `
                    <div class="foto-img" style="background-image: url('./${foto.name}');"></div>
                    <span class="watermark">aplicadorasena</span>
                `;
                galeriaContainer.appendChild(cardFoto);
            });
        } catch (erro) {
            galeriaContainer.innerHTML = '<p style="color: var(--text-muted);">Erro ao carregar as imagens do portfólio.</p>';
        }
    }

    // Executa a busca ao abrir o site
    carregarGaleriaGitHub();
</script>
